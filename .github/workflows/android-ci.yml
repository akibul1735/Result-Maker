name: Android CI Build

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

jobs:
  build-debug:
    name: Build & Lint Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK & Run Android Lint
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew lintDebug assembleDebug --no-daemon
          else
            gradle lintDebug assembleDebug --no-daemon
          fi

      - name: Prepare Debug APK Output
        run: |
          mkdir -p debug-output
          APK_SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::Debug APK not found."
            exit 1
          fi
          cp "$APK_SRC" debug-output/result_maker_debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: result-maker-debug-apk
          path: debug-output/result_maker_debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 7
