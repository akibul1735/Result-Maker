name: Android Release Build & Deploy

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Numeric Android versionCode'
        required: true
        default: '1'
      deploy_target:
        description: 'Deployment target'
        type: choice
        options:
          - github-release
          - play-internal
          - play-production
        default: 'github-release'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version_name=${{ inputs.version_name }}" >> $GITHUB_OUTPUT
            echo "version_code=${{ inputs.version_code }}" >> $GITHUB_OUTPUT
          else
            TAG_VER="${GITHUB_REF_NAME#v}"
            echo "version_name=$TAG_VER" >> $GITHUB_OUTPUT
            echo "version_code=${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Release Keystore from Secret
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Assemble Signed Release APK & Bundle
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'release' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            gradle assembleRelease bundleRelease --no-daemon
          fi

      - name: Verify Release APK Signature Fingerprint
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          "$APKSIGNER" verify --print-certs "$APK_FILE"

      - name: Clean up decoded keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Upload Signed Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: result-maker-release-${{ steps.meta.outputs.version_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Download Signed Artifacts
        uses: actions/download-artifact@v4
        with:
          name: result-maker-release-${{ needs.build-release.outputs.version_name }}
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-release.outputs.version_name }}
          name: Result Maker v${{ needs.build-release.outputs.version_name }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.aab

  deploy-google-play:
    name: Deploy to Google Play
    needs: build-release
    if: ${{ inputs.deploy_target == 'play-internal' || inputs.deploy_target == 'play-production' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Signed AAB
        uses: actions/download-artifact@v4
        with:
          name: result-maker-release-${{ needs.build-release.outputs.version_name }}
          path: release-artifacts

      - name: Upload App Bundle to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kgps.result
          releaseFiles: release-artifacts/**/*.aab
          track: ${{ inputs.deploy_target == 'play-production' && 'production' || 'internal' }}
          status: completed
