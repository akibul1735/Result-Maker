name: Android Release Build & Deploy

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Numeric Android versionCode'
        required: true
        default: '1'
      deploy_target:
        description: 'Deployment target'
        type: choice
        options:
          - github-release
          - play-internal
          - play-production
        default: 'github-release'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ inputs.version_name }}"
            CODE="${{ inputs.version_code }}"
            TAG="v${VER}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
            CODE="${{ github.run_number }}"
            TAG="${GITHUB_REF_NAME}"
          else
            VER="1.0.${{ github.run_number }}"
            CODE="${{ github.run_number }}"
            TAG="v${VER}"
          fi
          echo "version_name=${VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Release Signing Keystore
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/release.keystore
            if [ ! -s app/release.keystore ]; then
              echo "::error::Decoded app/release.keystore is empty."
              exit 1
            fi
            STORE_PWD="$RELEASE_KEYSTORE_PASSWORD"
            KEY_ALIAS="${RELEASE_KEY_ALIAS:-release}"
            KEY_PWD="${RELEASE_KEY_PASSWORD:-$STORE_PWD}"
            echo "using_secret_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret is not configured. Generating temporary signing keystore so release APK remains installable."
            rm -f app/release.keystore
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Result Maker, OU=KGPS, O=Result Maker, L=Dhaka, C=BD"
            STORE_PWD="android"
            KEY_ALIAS="release"
            KEY_PWD="android"
            echo "using_secret_keystore=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "RELEASE_KEYSTORE_PATH=release.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=${STORE_PWD}"
            echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}"
            echo "RELEASE_KEY_PASSWORD=${KEY_PWD}"
          } >> "$GITHUB_ENV"

      - name: Assemble Signed Release APK & Bundle
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            gradle assembleRelease bundleRelease --no-daemon
          fi

      - name: Stage Named Release Files (result_maker_release.apk)
        run: |
          mkdir -p release-output
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release"
            exit 1
          fi
          cp "$APK_SRC" release-output/result_maker_release.apk

          AAB_SRC=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1 || true)
          if [ -n "$AAB_SRC" ]; then
            cp "$AAB_SRC" release-output/result_maker_release.aab
          fi
          ls -lh release-output/

      - name: Verify Release APK Signature Fingerprint
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs release-output/result_maker_release.apk
          else
            echo "::warning::apksigner not found in ANDROID_HOME/build-tools; skipping certificate print."
          fi

      - name: Clean up decoded keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Upload Signed Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: result-maker-release-${{ steps.meta.outputs.version_name }}
          path: release-output/
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest

    steps:
      - name: Download Signed Artifacts
        uses: actions/download-artifact@v4
        with:
          name: result-maker-release-${{ needs.build-release.outputs.version_name }}
          path: release-artifacts

      - name: Verify Staged Release Files
        run: ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Result Maker ${{ needs.build-release.outputs.release_tag }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/result_maker_release.apk
            release-artifacts/result_maker_release.aab

  deploy-google-play:
    name: Deploy to Google Play
    needs: build-release
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.deploy_target == 'play-internal' || inputs.deploy_target == 'play-production') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Signed AAB
        uses: actions/download-artifact@v4
        with:
          name: result-maker-release-${{ needs.build-release.outputs.version_name }}
          path: release-artifacts

      - name: Upload App Bundle to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kgps.result
          releaseFiles: release-artifacts/result_maker_release.aab
          track: ${{ inputs.deploy_target == 'play-production' && 'production' || 'internal' }}
          status: completed
