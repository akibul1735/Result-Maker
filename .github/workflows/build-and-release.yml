name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (e.g. 1.0.1)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Numeric Android versionCode'
        required: true
        default: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Result Maker APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ inputs.version_name }}"
            CODE="${{ inputs.version_code }}"
            TAG="v${VER}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
            CODE="${{ github.run_number }}"
            TAG="${GITHUB_REF_NAME}"
          else
            VER="1.0.${{ github.run_number }}"
            CODE="${{ github.run_number }}"
            TAG="v${VER}"
          fi
          echo "version_name=${VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Web Companion Build
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi
          npm run lint
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Release Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/release.keystore
            if [ ! -s app/release.keystore ]; then
              echo "::error::Decoded app/release.keystore is empty."
              exit 1
            fi
            STORE_PWD="$RELEASE_KEYSTORE_PASSWORD"
            if [ -z "$STORE_PWD" ]; then
              echo "::error::RELEASE_KEYSTORE_PASSWORD secret is required when RELEASE_KEYSTORE_BASE64 is set."
              exit 1
            fi
            KEY_ALIAS="${RELEASE_KEY_ALIAS:-release}"
            KEY_PWD="${RELEASE_KEY_PASSWORD:-$STORE_PWD}"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not set. Signing with generated temporary release keystore."
            rm -f app/release.keystore
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Result Maker, OU=KGPS, O=Result Maker, L=Dhaka, C=BD"
            STORE_PWD="android"
            KEY_ALIAS="release"
            KEY_PWD="android"
          fi
          {
            echo "RELEASE_KEYSTORE_PATH=release.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=${STORE_PWD}"
            echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}"
            echo "RELEASE_KEY_PASSWORD=${KEY_PWD}"
          } >> "$GITHUB_ENV"

      - name: Build Signed Release APK
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Stage result_maker_release.apk
        run: |
          mkdir -p release-output
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release"
            exit 1
          fi
          cp "$APK_SRC" release-output/result_maker_release.apk
          ls -lh release-output/result_maker_release.apk

      - name: Verify APK Signature
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs release-output/result_maker_release.apk
          fi

      - name: Clean up decoded keystore
        if: always()
        run: rm -f app/release.keystore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: result_maker_release
          path: release-output/result_maker_release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (APK only)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Result Maker ${{ steps.meta.outputs.release_tag }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: release-output/result_maker_release.apk
