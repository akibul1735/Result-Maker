name: Build & Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (leave blank for auto 1.0.<run_number>)'
        required: false
        default: ''
      version_code:
        description: 'Numeric Android versionCode (leave blank for auto run_number)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Result Maker APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize log workspace
        run: mkdir -p build-logs release-output

      - name: Resolve release metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VER="${{ inputs.version_name }}"
            CODE="${{ inputs.version_code }}"
            VER="${VER:-1.0.${{ github.run_number }}}"
            CODE="${CODE:-${{ github.run_number }}}"
            TAG="v${VER}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
            CODE="${{ github.run_number }}"
            TAG="${GITHUB_REF_NAME}"
          else
            VER="1.0.${{ github.run_number }}"
            CODE="${{ github.run_number }}"
            TAG="v${VER}"
          fi
          echo "version_name=${VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore canonical Firebase config from GitHub Secret (fallback to committed)
        id: gs_prep
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
        run: |
          python3 - <<'PYEOF'
          import base64
          import json
          import os
          import xml.sax.saxutils as sx

          b64_val = os.environ.get("GOOGLE_SERVICES_JSON_BASE64", "").strip()
          raw_val = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()

          def try_decode_json(candidate: str):
              text = candidate.strip()
              if not text:
                  return None, "empty"
              # 1. Direct JSON
              try:
                  json.loads(text)
                  return text, "json"
              except Exception:
                  pass
              # 2. Single or double Base64-encoded JSON
              current = "".join(text.split())
              for step in (1, 2):
                  try:
                      padded = current + "=" * ((4 - len(current) % 4) % 4)
                      decoded_bytes = base64.b64decode(padded, validate=False)
                      decoded_text = decoded_bytes.decode("utf-8").strip()
                      try:
                          json.loads(decoded_text)
                          return decoded_text, f"base64-x{step}"
                      except Exception:
                          current = "".join(decoded_text.split())
                  except Exception:
                      break
              return None, "invalid"

          source_name = None
          resolved_json = None
          resolved_mode = None

          if b64_val:
              resolved_json, resolved_mode = try_decode_json(b64_val)
              source_name = "GOOGLE_SERVICES_JSON_BASE64"
          elif raw_val:
              resolved_json, resolved_mode = try_decode_json(raw_val)
              source_name = "GOOGLE_SERVICES_JSON"

          gh_out = os.environ.get("GITHUB_OUTPUT")
          def set_output(k, v):
              if gh_out:
                  with open(gh_out, "a", encoding="utf-8") as f:
                      f.write(f"{k}={v}\n")

          if source_name:
              if resolved_json is not None:
                  with open("app/google-services.json", "w", encoding="utf-8") as f:
                      f.write(resolved_json)
                      if not resolved_json.endswith("\n"):
                          f.write("\n")
                  set_output("from_secret", "true")
                  print(f"Restored canonical app/google-services.json from {source_name} ({resolved_mode}).")
              else:
                  print(f"::error::{source_name} secret is set, but its contents are neither valid JSON nor Base64-encoded JSON.")
                  raise SystemExit(1)
          elif os.path.exists("app/google-services.json") and os.path.getsize("app/google-services.json") > 0:
              set_output("from_secret", "false")
              print("Using committed app/google-services.json.")
          else:
              set_output("from_secret", "false")
              print("No GOOGLE_SERVICES_JSON(_BASE64) secret and no committed app/google-services.json found.")

          db_id = os.environ.get("FIRESTORE_DATABASE_ID", "").strip()
          if db_id:
              if db_id.lower() == "default":
                  print("::warning::FIRESTORE_DATABASE_ID secret was 'default'; normalizing to '(default)'.")
                  db_id = "(default)"
              xml_content = (
                  '<?xml version="1.0" encoding="utf-8" standalone="no"?>\n'
                  "<resources>\n"
                  f'    <string name="firestore_database_id" translatable="false">{sx.escape(db_id)}</string>\n'
                  "</resources>\n"
              )
              with open("app/src/main/res/values/firebase_applet_config.xml", "w", encoding="utf-8") as f:
                  f.write(xml_content)
              print(f"Applied FIRESTORE_DATABASE_ID secret ({db_id}) to firebase_applet_config.xml.")
          PYEOF

      - name: Pre-flight environment & config check
        id: precheck
        run: |
          {
            echo "=== Timestamp (UTC) ==="
            date -u
            echo ""
            echo "=== Java ==="
            java -version 2>&1 || true
            echo ""
            echo "=== Gradle ==="
            gradle --version 2>&1 || true
            echo ""
            echo "=== Android SDK ==="
            SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            echo "SDK_DIR=$SDK_DIR"
            if [ -n "$SDK_DIR" ]; then
              ls -1 "$SDK_DIR/platforms" 2>/dev/null || echo "No platforms listed"
              ls -1 "$SDK_DIR/build-tools" 2>/dev/null || echo "No build-tools listed"
              if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
                yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
              fi
            fi
            echo ""
            echo "=== Firebase & Manifest Files ==="
            if [ -s app/google-services.json ]; then
              echo "app/google-services.json: PRESENT ($(wc -c < app/google-services.json) bytes)"
              if command -v python3 >/dev/null 2>&1; then
                python3 -m json.tool app/google-services.json >/dev/null && echo "google-services.json syntax: VALID JSON"
              fi
              if grep -Eq '"package_name"[[:space:]]*:[[:space:]]*"com\.kgps\.result"' app/google-services.json; then
                echo "google-services.json package match: OK (com.kgps.result)"
              else
                echo "google-services.json package match: WARNING (com.kgps.result not found)"
              fi
              if grep -Eq '"client_type"[[:space:]]*:[[:space:]]*3' app/google-services.json; then
                echo "google-services.json Web OAuth client (client_type 3): PRESENT"
              else
                echo "google-services.json Web OAuth client (client_type 3): MISSING (Google Sign-In requires enabling Google provider in Firebase Auth)"
              fi
              if command -v python3 >/dev/null 2>&1; then
                PROJECT_ID=$(python3 -c 'import json; d=json.load(open("app/google-services.json")); print(d.get("project_info", {}).get("project_id", "unknown"))' 2>/dev/null || echo "unknown")
                echo "google-services.json project_id: $PROJECT_ID"
              fi
            else
              echo "app/google-services.json: MISSING"
            fi
            if [ -s app/src/main/res/values/firebase_applet_config.xml ]; then
              echo "firebase_applet_config.xml: PRESENT"
              if command -v python3 >/dev/null 2>&1; then
                DB_ID=$(python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("app/src/main/res/values/firebase_applet_config.xml").getroot(); print(next((e.text for e in r.findall("string") if e.attrib.get("name")=="firestore_database_id"), "unknown"))' 2>/dev/null || echo "unknown")
                echo "firestore_database_id: $DB_ID"
              fi
            else
              echo "firebase_applet_config.xml: MISSING"
            fi
          } | tee build-logs/environment.log

          if [ ! -s app/google-services.json ]; then
            echo "::error::app/google-services.json is missing. Add the GOOGLE_SERVICES_JSON_BASE64 (or GOOGLE_SERVICES_JSON) GitHub Actions secret, or commit app/google-services.json."
            exit 1
          fi
          if command -v python3 >/dev/null 2>&1 && ! python3 -m json.tool app/google-services.json >/dev/null 2>&1; then
            echo "::error::app/google-services.json is not valid JSON. Check your GOOGLE_SERVICES_JSON(_BASE64) secret or committed file."
            exit 1
          fi

      - name: Restore Cached Fallback Keystore
        id: ks_cache
        uses: actions/cache/restore@v4
        with:
          path: app/release.keystore
          key: result-maker-fallback-keystore-v1

      - name: Prepare Release Signing Keystore
        id: ks_prep
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > app/release.keystore
            if [ ! -s app/release.keystore ]; then
              echo "::error::Decoded app/release.keystore is empty."
              exit 1
            fi
            STORE_PWD="$RELEASE_KEYSTORE_PASSWORD"
            if [ -z "$STORE_PWD" ]; then
              echo "::error::RELEASE_KEYSTORE_PASSWORD (or KEYSTORE_PASSWORD) secret is required when RELEASE_KEYSTORE_BASE64 (or KEYSTORE_BASE64) is set."
              exit 1
            fi
            KEY_ALIAS="${RELEASE_KEY_ALIAS:-release}"
            KEY_PWD="${RELEASE_KEY_PASSWORD:-$STORE_PWD}"
            echo "generated_fallback=false" >> "$GITHUB_OUTPUT"
            echo "keystore_mode=secret" >> "$GITHUB_OUTPUT"
          elif [ -f app/release.keystore ] && [ -s app/release.keystore ]; then
            echo "Reusing cached CI release keystore so APK updates over previous cached builds."
            STORE_PWD="android"
            KEY_ALIAS="release"
            KEY_PWD="android"
            echo "generated_fallback=false" >> "$GITHUB_OUTPUT"
            echo "keystore_mode=cached_fallback" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Neither RELEASE_KEYSTORE_BASE64 nor KEYSTORE_BASE64 secret is set. Generating fallback keystore and caching it (configure RELEASE_KEYSTORE_BASE64 or KEYSTORE_BASE64 for permanent upgrade continuity across >7-day gaps)."
            rm -f app/release.keystore
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Result Maker, OU=KGPS, O=Result Maker, L=Dhaka, C=BD" \
              >> build-logs/keystore.log 2>&1
            STORE_PWD="android"
            KEY_ALIAS="release"
            KEY_PWD="android"
            echo "generated_fallback=true" >> "$GITHUB_OUTPUT"
            echo "keystore_mode=new_fallback" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "RELEASE_KEYSTORE_PATH=release.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=${STORE_PWD}"
            echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}"
            echo "RELEASE_KEY_PASSWORD=${KEY_PWD}"
          } >> "$GITHUB_ENV"

      - name: Cache Generated Fallback Keystore
        if: steps.ks_prep.outputs.generated_fallback == 'true'
        uses: actions/cache/save@v4
        with:
          path: app/release.keystore
          key: result-maker-fallback-keystore-v1

      - name: Build Signed Release APK
        id: gradle_build
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          set -o pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace --info 2>&1 | tee build-logs/gradle-build.log
          else
            gradle assembleRelease --no-daemon --stacktrace --info 2>&1 | tee build-logs/gradle-build.log
          fi

      - name: Stage result_maker_release.apk
        id: stage_apk
        run: |
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::No release APK found in app/build/outputs/apk/release"
            ls -la app/build/outputs/apk/release 2>&1 | tee -a build-logs/environment.log || true
            exit 1
          fi
          cp "$APK_SRC" release-output/result_maker_release.apk
          APK_SIZE=$(du -h release-output/result_maker_release.apk | cut -f1)
          APK_SHA256=$(sha256sum release-output/result_maker_release.apk | awk '{print $1}')
          echo "apk_source=${APK_SRC}" >> "$GITHUB_OUTPUT"
          echo "apk_size=${APK_SIZE}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          ls -lh release-output/result_maker_release.apk

      - name: Verify APK Signature
        id: apk_verify
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs release-output/result_maker_release.apk 2>&1 | tee build-logs/apksigner.log
          else
            echo "apksigner binary not found under $SDK_DIR/build-tools" | tee build-logs/apksigner.log
          fi

      - name: Clean up temporary secret files
        if: always()
        run: |
          rm -f app/release.keystore
          if [ "${{ steps.gs_prep.outputs.from_secret }}" = "true" ]; then
            rm -f app/google-services.json
          fi

      - name: Upload APK Artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: result_maker_release
          path: release-output/result_maker_release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (APK only)
        id: gh_release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Result Maker ${{ steps.meta.outputs.release_tag }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: release-output/result_maker_release.apk

      - name: Prune Old GitHub Releases (Keep Latest 5)
        id: prune_releases
        if: github.event_name != 'pull_request' && steps.gh_release.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          current_tag = os.environ.get("CURRENT_TAG", "")
          keep_count = 5

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "result-maker-ci",
          }

          def api_request(method: str, path: str):
              url = f"https://api.github.com{path}"
              req = urllib.request.Request(url, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode("utf-8")
                  return resp.status, (json.loads(body) if body else None)

          releases = []
          page = 1
          while True:
              _, batch = api_request("GET", f"/repos/{repo}/releases?per_page=100&page={page}")
              if not batch:
                  break
              releases.extend(r for r in batch if not r.get("draft", False))
              if len(batch) < 100:
                  break
              page += 1

          releases.sort(
              key=lambda r: (
                  r.get("tag_name") == current_tag,
                  r.get("created_at") or "",
                  r.get("id") or 0,
              ),
              reverse=True,
          )

          to_delete = releases[keep_count:]
          if not to_delete:
              print(f"Found {len(releases)} published release(s); nothing to prune (max {keep_count}).")
              raise SystemExit(0)

          print(f"Found {len(releases)} published release(s); keeping latest {keep_count}, pruning {len(to_delete)}.")
          for rel in to_delete:
              rel_id = rel["id"]
              tag = rel.get("tag_name", "")
              if tag == current_tag:
                  continue
              api_request("DELETE", f"/repos/{repo}/releases/{rel_id}")
              print(f"Deleted release id={rel_id} (tag={tag}).")
              if tag:
                  encoded_tag = urllib.parse.quote(tag, safe="")
                  try:
                      api_request("DELETE", f"/repos/{repo}/git/refs/tags/{encoded_tag}")
                      print(f"Deleted tag ref {tag}.")
                  except urllib.error.HTTPError as e:
                      if e.code in (404, 422):
                          print(f"Tag ref {tag} already absent (HTTP {e.code}).")
                      else:
                          raise
          PYEOF

      - name: Prepare Inspection Log Report Files
        id: inspect_files
        if: always()
        run: |
          mkdir -p build-logs/gradle-reports
          {
            echo "# Result Maker CI Inspection Report"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | \`${{ github.event_name }}\` (\`${{ github.ref_name }}\`) |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Version | \`${{ steps.meta.outputs.version_name || 'unknown' }}\` (code \`${{ steps.meta.outputs.version_code || 'unknown' }}\`) |"
            echo "| Release Tag | \`${{ steps.meta.outputs.release_tag || 'unknown' }}\` |"
            echo "| Keystore Mode | \`${{ steps.ks_prep.outputs.keystore_mode || 'not-run' }}\` |"
            echo ""
            echo "## Step Outcomes"
            echo ""
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| Environment & Config Pre-check | \`${{ steps.precheck.outcome }}\` |"
            echo "| Keystore Preparation | \`${{ steps.ks_prep.outcome }}\` |"
            echo "| Gradle Release Build | \`${{ steps.gradle_build.outcome }}\` |"
            echo "| Stage APK | \`${{ steps.stage_apk.outcome }}\` |"
            echo "| Verify APK Signature | \`${{ steps.apk_verify.outcome }}\` |"
            echo "| Upload APK Artifact | \`${{ steps.upload_apk.outcome }}\` |"
            echo "| Publish GitHub Release | \`${{ steps.gh_release.outcome }}\` |"
            echo "| Prune Old Releases (Keep 5) | \`${{ steps.prune_releases.outcome }}\` |"
            echo ""

            if [ -n "${{ steps.stage_apk.outputs.apk_size }}" ]; then
              echo "## Release APK Details"
              echo "- **Source**: \`${{ steps.stage_apk.outputs.apk_source }}\`"
              echo "- **Size**: \`${{ steps.stage_apk.outputs.apk_size }}\`"
              echo "- **SHA-256**: \`${{ steps.stage_apk.outputs.apk_sha256 }}\`"
              echo ""
            fi

            if [ -s build-logs/environment.log ]; then
              echo "## Environment & Firebase Config"
              echo '```text'
              cat build-logs/environment.log
              echo '```'
              echo ""
            fi

            if [ -s build-logs/apksigner.log ]; then
              echo "## APK Signature Verification"
              echo '```text'
              cat build-logs/apksigner.log
              echo '```'
              echo ""
            fi

            if [ -s build-logs/gradle-build.log ]; then
              echo "## Gradle Warnings / Errors Excerpt"
              echo '```text'
              grep -nE "FAILURE:|What went wrong:|Execution failed|Exception:|ERROR:|e: |w: " build-logs/gradle-build.log | tail -n 80 || true
              echo "--- Tail of gradle-build.log (last 80 lines) ---"
              tail -n 80 build-logs/gradle-build.log
              echo '```'
              echo ""
            fi

            if [ "${{ steps.precheck.outcome }}" = "failure" ]; then
              echo "## Firebase Config Troubleshooting"
              echo "- Add repository secret \`GOOGLE_SERVICES_JSON_BASE64\` (base64 of \`app/google-services.json\`) or \`GOOGLE_SERVICES_JSON\` (raw JSON) under **Settings -> Secrets and variables -> Actions**, or commit \`app/google-services.json\`."
              echo "- Ensure your Firebase project includes Android app \`com.kgps.result\` and Google Sign-In enabled (Web OAuth \`client_type: 3\`)."
              echo ""
            fi

            if [ "${{ steps.gh_release.outcome }}" = "failure" ]; then
              echo "## Release Publish Troubleshooting"
              echo "- Ensure **Settings -> Actions -> General -> Workflow permissions** is set to **Read and write permissions** so \`GITHUB_TOKEN\` can create GitHub Releases."
              echo ""
            fi
          } > build-logs/inspection-summary.md

          if [ -d build/reports ]; then cp -r build/reports build-logs/gradle-reports/root-reports 2>/dev/null || true; fi
          if [ -d app/build/reports ]; then cp -r app/build/reports build-logs/gradle-reports/app-reports 2>/dev/null || true; fi
          if [ -d app/build/outputs/logs ]; then cp -r app/build/outputs/logs build-logs/gradle-reports/output-logs 2>/dev/null || true; fi
          ls -lhR build-logs > build-logs/files-manifest.txt 2>&1 || true

      - name: Upload Inspection Log Report Artifact
        id: upload_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-inspection-logs-${{ github.run_number }}
          path: build-logs/
          if-no-files-found: error
          retention-days: 14

      - name: Publish Summary & Artifact Download Link
        if: always()
        run: |
          {
            echo "## Download Inspection Logs"
            echo ""
            if [ -n "${{ steps.upload_logs.outputs.artifact-url }}" ]; then
              echo "- **Direct ZIP Download:** [Download workflow-inspection-logs-${{ github.run_number }}](${{ steps.upload_logs.outputs.artifact-url }})"
            else
              echo "- **Artifact Upload Status:** \`${{ steps.upload_logs.outcome }}\` (check the **Artifacts** section at the bottom of the workflow run summary)"
            fi
            echo "- **Run Summary & Artifacts Page:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            if [ -s build-logs/inspection-summary.md ]; then
              cat build-logs/inspection-summary.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
