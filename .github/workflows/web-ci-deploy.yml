name: Web Companion CI & Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - '.github/workflows/web-ci-deploy.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-and-build:
    name: Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Upload production dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: result-maker-web-dist
          path: dist/
          retention-days: 14

  deploy-pages:
    name: Deploy Static Preview to GitHub Pages
    needs: verify-and-build
    if: github.ref == 'refs/heads/main' && vars.ENABLE_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: result-maker-web-dist
          path: dist/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
